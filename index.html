<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gül Kebap Landau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Golos+Text:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
/* Layout: local-business structure (see references/ВКУС.md): header bar, hero (poster / split / type / paper / cover),
   about badge + cards, tilted photo slider in a giant phrase, menu as tour panel, order / reservation via WhatsApp, reviews, FAQ, contact, logo footer. */
:root{
  color-scheme:light;
  --bg:#f8f0ee;
  --card:#fdf8f7;
  --card-2:#efdfdc;
  --line:rgba(50,30,15,.13);
  --text:#211912;
  --mute:#77695b;
  --accent:#b3264f;
  --on-accent:#fff5f7;
  --star:#d39a2a;
  --nav-bg:rgba(248,240,238,.93);
  --foot-bg:#b3264f;
  --foot-ink:#fff5f7;
  --head:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Golos Text","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --head-w:800;
  --head-case:none;
  --head-ls:-.03em;
  --hero-bg:#ad2550;
  --hero-hi:#de5c83;
  --hero-lo:#5a0d27;
  --photo-top:#b72149;
  --hero-edge:#83092e;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);overflow-x:hidden;overflow-x:clip}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--body);overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%;display:block}
a{color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--head);font-weight:var(--head-w,600);text-transform:var(--head-case,uppercase);letter-spacing:var(--head-ls,-.01em);margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.2vw,56px);line-height:1}
h3{font-size:clamp(16px,1.4vw,19px);line-height:1.2;letter-spacing:0}
em.it{font:italic 400 1.04em/1 var(--serif);text-transform:none;letter-spacing:0}
.mute{color:var(--mute)}
section{scroll-margin-top:72px}
.sec{padding-block:clamp(64px,9vw,120px)}
.sec + .sec{padding-top:0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sec-head p{max-width:440px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font:600 14px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:16px 26px;transition:background .2s,transform .2s}
.btn-acc{background:var(--accent);color:var(--on-accent)}
.btn-acc:hover{filter:brightness(1.08)}
.btn-line{border:1px solid var(--line);color:var(--text);background:transparent}
.btn-line:hover{border-color:var(--mute)}
.btn[aria-disabled="true"]{background:var(--card-2);color:var(--mute);pointer-events:none}
.stars{color:var(--star);letter-spacing:2px}

/* header */
.nav{position:fixed;z-index:50;top:0;left:0;right:0;background:var(--nav-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .inner{display:flex;align-items:center;gap:24px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) 12px}
.logo{display:grid;text-decoration:none;line-height:1}
.logo b{font:var(--head-w,600) 22px/1 var(--head);letter-spacing:.03em;text-transform:var(--head-case,uppercase)}
.logo small{font:500 9px/1 var(--body);letter-spacing:.2em;white-space:nowrap;text-transform:uppercase;color:var(--mute);margin-top:5px}
.nav ul{display:flex;gap:26px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{font:500 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:8px 0;border-bottom:1px solid transparent}
.nav ul a:hover,.nav ul a.on{color:var(--text);border-color:var(--accent)}
.nav .btn{padding:12px 18px;font-size:12px}
.burger{display:none;position:relative;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--text);cursor:pointer;padding:0}
.burger i{position:absolute;left:11px;width:16px;height:1.5px;background:currentColor;transition:transform .3s}
.burger i:first-child{top:15.5px}.burger i:last-child{top:21.5px}
.nav.open .burger i:first-child{transform:translateY(3px) rotate(45deg)}
.nav.open .burger i:last-child{transform:translateY(-3px) rotate(-45deg)}

/* hero shared */
.hero{padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
.open-now{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.open-now.is-open .dot{background:#5fbf6a;opacity:1}
.rating{display:flex;align-items:center;gap:12px;font-size:14px}
.rating b{font:var(--head-w,600) 28px/1 var(--head)}

/* hero: split */
.h-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:10px;min-height:min(84svh,760px)}
.h-panel{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.h-panel .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.h-split h1{font-size:clamp(38px,5.8vw,86px);line-height:.98;margin-top:14px}
.h-split .sub{max-width:420px;font-size:17px;margin-top:20px}
.h-panel .btn{background:var(--on-accent);color:var(--accent)}
.h-panel .stars{color:currentColor}
.h-foot{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.h-photo{border-radius:var(--r);overflow:hidden;position:relative;min-height:300px}
.h-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.h-chip{position:absolute;left:16px;bottom:16px;background:var(--bg);color:var(--text);border-radius:999px;padding:10px 16px;font-size:13px}

/* hero: type with inline photos */
.h-type{padding-block:clamp(24px,5vw,64px) clamp(8px,2vw,24px);display:flex;flex-direction:column}
.h-type .kick{order:0}.h-type h1{order:1}.h-type .h-row{order:2}
.h-type-photo{order:3;margin-top:clamp(20px,3vw,36px);border-radius:var(--r);overflow:hidden;aspect-ratio:16/7;position:relative}
.h-type-photo img{width:100%;height:100%;object-fit:cover;animation:heroIn 1.8s cubic-bezier(.2,.7,.2,1) both}
.h-type .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.h-type h1{font-size:clamp(40px,8.4vw,132px);line-height:1.02;margin-top:18px}
.h-type .pic{display:inline-block;vertical-align:middle;height:.8em;border-radius:999px;overflow:hidden;margin:0 .06em;position:relative;top:-.05em}
.h-type .pic img{height:100%;width:auto;aspect-ratio:2.1/1;object-fit:cover}
.h-type .pic.sq img{aspect-ratio:1/1}
.h-type h1 .acc{color:var(--accent)}
.h-row{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-top:clamp(28px,4vw,52px);border-top:1px solid var(--line);padding-top:24px}
.h-row .sub{max-width:420px;color:var(--mute);font-size:17px}
.h-meta{display:flex;gap:28px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.h-meta b{display:block;font:var(--head-w,600) 22px/1.1 var(--head);color:var(--text)}

/* hero: paper collage */
.h-paper{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(20px,4vw,48px)}
.h-paper .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.h-paper h1{font-size:clamp(40px,5.8vw,84px);line-height:1;margin-top:16px}
.h-paper h1 em.it{color:var(--accent)}
.h-paper .sub{max-width:420px;color:var(--mute);font-size:17px;margin-top:20px}
.h-actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:28px}
.collage{position:relative;height:clamp(420px,46vw,600px)}
.print{position:absolute;margin:0;background:#fff;padding:10px 10px 34px;box-shadow:0 18px 40px rgba(40,25,10,.18),0 2px 6px rgba(40,25,10,.12)}
.print img{width:100%;aspect-ratio:4/5;object-fit:cover}
.print span{position:absolute;left:12px;bottom:9px;font:italic 400 17px/1 var(--serif);color:#6b625a}
.p1{width:52%;left:4%;top:6%;transform:rotate(-5deg);z-index:2}
.p2{width:44%;right:2%;top:0;transform:rotate(4deg);z-index:1}
.p3{width:40%;right:10%;bottom:0;transform:rotate(-2deg);z-index:3}
.p3 img{aspect-ratio:1/1}
.stamp{position:absolute;left:0;bottom:6%;z-index:4;width:118px;height:118px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);font:600 13px/1.15 var(--body);text-transform:uppercase}
.stamp b{display:block;font:var(--head-w,600) 30px/1 var(--head)}

/* hero: photo in the background, light text card on top of it */
.h-cover{position:relative;border-radius:var(--r);overflow:hidden;min-height:min(82svh,760px);display:flex;align-items:flex-end;padding:clamp(14px,2.6vw,32px)}
.h-cover > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:heroIn 1.8s cubic-bezier(.2,.7,.2,1) both}
.h-card{position:relative;z-index:1;background:var(--bg);border-radius:calc(var(--r) - 4px);padding:clamp(22px,3.4vw,44px);max-width:640px;display:grid;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.h-card .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.h-card h1{font-size:clamp(36px,4.8vw,70px);line-height:1}
.h-card h1 em.it{color:var(--accent)}
.h-card .sub{color:var(--mute);font-size:17px;max-width:460px}
.h-card .h-foot{margin-top:6px}

/* hero: poster. Photo card, giant condensed word across it, cut-out product in front of the word,
   glass card with the offer bottom-left, glass rating chip bottom-right (refs: PLAY STRONG / MOVE FASTER) */
.h-poster{position:relative;margin-bottom:clamp(48px,7vw,100px)}
.hp-stage{position:relative;height:min(84svh,800px);min-height:560px}
.hp-bg{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:var(--card-2)}
.hp-bg img{width:100%;height:100%;object-fit:cover;animation:heroIn 1.8s cubic-bezier(.2,.7,.2,1) both}
.hp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.42),rgba(10,8,6,.08) 45%,rgba(10,8,6,.3))}
.hp-big{position:absolute;z-index:1;left:0;right:0;top:24%;margin:0;text-align:center;color:#fff;white-space:nowrap;
  font:400 min(calc((min(1200px,100vw) - 32px) * 1.72 / var(--len)),240px)/.86 "Anton","Impact",sans-serif;text-transform:uppercase;letter-spacing:.005em}
.hp-obj{position:absolute;z-index:2;left:var(--ol,57%);bottom:-12%;width:var(--ow,min(62%,760px));transform:translateX(-50%) rotate(-9deg);filter:drop-shadow(0 34px 40px rgba(0,0,0,.4));pointer-events:none;animation:objIn 1.2s cubic-bezier(.2,.7,.2,1) both .2s}
@keyframes objIn{from{opacity:0;transform:translateX(-50%) translateY(40px) rotate(-14deg)}to{opacity:1}}
.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 34px rgba(0,0,0,.18)}
.hp-card{position:absolute;z-index:3;left:clamp(14px,2.2vw,28px);bottom:clamp(14px,2.2vw,28px);width:min(360px,42%);border-radius:22px;padding:22px;display:grid;gap:12px;color:#fff;background:rgba(20,14,10,.3)}
.hp-card .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hp-card .hp-title{font:var(--head-w,600) 22px/1.15 var(--head);text-transform:none;letter-spacing:-.01em}
.hp-card .hp-title em.it{color:inherit}
.hp-card .sub{font-size:15px;opacity:.88}
.hp-card .btn{justify-self:start}
.hp-card .open-now{font-size:13px}
.hp-chip{position:absolute;z-index:3;right:clamp(14px,2.2vw,28px);bottom:clamp(14px,2.2vw,28px);border-radius:20px;padding:14px 18px;color:#fff;display:flex;gap:12px;align-items:center;font-size:13px}
.hp-chip b{font:400 34px/1 "Anton",sans-serif}
.hp-chip .stars{color:#ffd36a}

/* hero: studio (ref Stridex). One-colour backdrop, cut-out product in the middle, headline left,
   white card with mixed grey/black words top-right, glass fact card bottom-right, photo strip bottom-left */
.hero:has(.h-studio){padding:0}
.h-studio{position:relative;max-width:none;border-radius:0;overflow:hidden;min-height:min(100svh,980px);color:#fff;
  background:radial-gradient(70% 80% at 55% 42%,var(--hero-hi,#e2775a) 0%,var(--hero-bg,#b8402a) 55%,var(--hero-lo,#7a2414) 100%);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.9fr) minmax(0,.75fr);grid-template-rows:1fr auto;gap:20px;padding:calc(env(safe-area-inset-top,0px) + 96px) max(20px,calc((100vw - 1200px) / 2)) clamp(22px,3vw,36px)}
.hs-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;animation:heroIn 1.8s cubic-bezier(.2,.7,.2,1) both}
.h-studio.has-photo{background:var(--hero-edge,#034362)}
.hs-left{grid-column:1;grid-row:1;display:grid;gap:20px;align-content:center;position:relative;z-index:2}
.hs-tags{display:flex;flex-wrap:wrap;gap:8px;max-width:380px}
.has-photo .hs-bottom .addr{display:none}
.hs-tags span{border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:7px 12px;font-size:12px;line-height:1}
.hs-tags span::before{content:"• "}
.h-studio h1{font-size:clamp(36px,4.6vw,66px);line-height:1.02;color:#fff;text-transform:none;letter-spacing:-.02em}
.h-studio h1 em.it{color:#fff}
.hs-sub{max-width:380px;font-size:16px;opacity:.9}
.hs-cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hs-cta .btn{white-space:nowrap}
.hs-cta .btn-acc{background:#fff;color:var(--hero-lo,#7a2414)}
.hs-cta .ghost{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:15px 22px;font:600 14px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.hs-obj{position:absolute;z-index:1;left:var(--ol,52%);top:50%;width:var(--ow,min(48%,620px));transform:translate(-50%,-46%) rotate(-8deg);filter:drop-shadow(0 40px 50px rgba(0,0,0,.35));animation:float 6s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translate(-50%,-50%) rotate(-5deg)}}
.hs-right{grid-column:3;grid-row:1;display:grid;gap:16px;align-content:space-between;position:relative;z-index:2}
.hs-card{background:#fff;color:#141414;border-radius:24px;padding:20px;display:grid;gap:14px;box-shadow:12px 12px 0 rgba(0,0,0,.12)}
.hs-card .chip{justify-self:start;border:1px solid #ddd;border-radius:999px;padding:6px 10px;font-size:11px}
.hs-card .words{font:600 clamp(22px,2.1vw,30px)/1.12 var(--body);letter-spacing:-.01em}
.hs-card .words i{font-style:normal;color:#a8a8a8}
.hs-card .btn{background:#f1f1f1;color:#141414;width:100%}
.hs-facts{border-radius:22px;padding:18px;color:#fff;display:grid;gap:12px}
.hs-facts .top{display:flex;justify-content:space-between;align-items:end;gap:10px}
.hs-facts b{font:700 40px/1 var(--body)}
.hs-facts ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.hs-facts li::before{content:"● ";font-size:9px;vertical-align:2px}
.hs-bottom{grid-column:1/-1;grid-row:2;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;position:relative;z-index:2;font-size:13px}
.hs-thumbs{display:flex;align-items:center;gap:6px;border-radius:16px;padding:6px;text-decoration:none;color:#fff}
.hs-thumbs img{width:58px;height:44px;border-radius:10px;object-fit:cover}
.hs-thumbs span{font-size:12px;line-height:1.2;padding:0 6px}
.hs-bottom .open-now{color:#fff}
.hs-bottom .addr{opacity:.9}

/* intro row: round badge + staggered cards (ref 2) */
.intro-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(24px,4vw,44px)}
.intro-head p{max-width:520px;color:var(--mute);font-size:17px}
.intro{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.badge{width:clamp(140px,13vw,176px);aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-align:center;align-content:center;gap:4px;font-size:13px;color:var(--mute)}
.badge b{font:400 46px/1 "Anton",sans-serif;color:var(--text)}
.badge .stars{font-size:12px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px;display:grid;gap:10px;align-content:start}
.icard:nth-child(3){margin-top:44px}
.icard .n{font:400 30px/1 "Anton",sans-serif;color:var(--accent)}
.icard p{color:var(--mute);font-size:15px}

/* stage: giant two-line phrase split around a tilted photo card that slides (ref 2) */
.stage2{position:relative;padding-block:clamp(70px,9vw,130px)}
.st-line{display:flex;justify-content:space-between;gap:calc(clamp(190px,23vw,300px) + 60px);margin:0;font:var(--head-w,600) clamp(40px,6.6vw,104px)/1.02 var(--head);letter-spacing:-.03em;text-transform:none;white-space:nowrap}
.st-line.l1{color:var(--mute);opacity:.55}
.st-line.l2{color:var(--text)}
.st-cards{position:absolute;left:50%;top:50%;width:clamp(190px,23vw,300px);aspect-ratio:3/4;transform:translate(-50%,-50%);z-index:2}
.st-card{all:unset;box-sizing:border-box;position:absolute;inset:0;border-radius:30px;overflow:hidden;cursor:zoom-in;box-shadow:0 26px 50px rgba(0,0,0,.22);transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s;opacity:0;transform:rotate(12deg) translateX(40%) scale(.9)}
.st-card img{width:100%;height:100%;object-fit:cover}
.st-card.cur{opacity:1;z-index:3;transform:rotate(-7deg)}
.st-card.nxt{opacity:1;z-index:2;transform:rotate(6deg) translateX(14%) scale(.94)}
.st-card.prv{opacity:0;z-index:1;transform:rotate(-20deg) translateX(-60%) scale(.9)}
.st-card span{position:absolute;left:12px;right:12px;bottom:12px;border-radius:14px;padding:10px 12px;color:#fff;font-size:13px;line-height:1.3}
.st-card:focus-visible{outline:3px solid var(--accent)}
.st-nav{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:clamp(28px,4vw,48px)}
.st-nav button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.st-nav button.next{background:var(--text);color:var(--bg);border-color:var(--text)}
.st-dots{display:flex;gap:6px}
.st-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.st-dots i.on{background:var(--accent);width:20px;border-radius:4px}

/* menu as a tour panel: header + scrolling photo cards that act as category tabs (ref 2) */
.tour{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(20px,4vw,48px);display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:clamp(20px,4vw,48px);align-items:end}
.tour-head{display:grid;gap:16px;align-content:end}
.tour-thumb{width:84px;height:60px;border-radius:14px;object-fit:cover}
.tour-head p{color:var(--mute)}

function slotsFor(d, step, lead){
  const H = CFG.hours && CFG.hours[d.getDay()]; if (!H) return [];
  const now = berlinNow(), same = d.toDateString() === now.toDateString(), res = [];
  const last = A.mode === 'reserve' ? Math.min(H[1] - 1.5, 24) : Math.min(H[1] - .25, 24);
  for (let m = H[0]*60; m <= last*60; m += step){
    if (same && m < now.getHours()*60 + now.getMinutes() + lead) continue;
    res.push(hhmm(m/60));
  }
  return res;
}
function openDays(n){
  const now = berlinNow(), out = [];
  for (let i = 0; out.length < n && i < 16; i++){

    if (!CFG.hours || !CFG.hours[d.getDay()] || (i === 0 && !slotsFor(d, 30, 60).length)) continue;
    out.push(d);
  }
  return out;
}

    if (!cart.size) L.push('…');
    L.push('Summe: ' + euro(sum));
    L.push('Abholung: ' + (st.time ? (st.time === 'sofort' ? 'so schnell wie möglich' : 'heute ' + st.time + ' Uhr') : '…'));
  } else {
    L.push('Hallo ' + CFG.short + ', ich möchte einen Tisch reservieren:');
    L.push('Tag: ' + (st.day ? DAY_LONG[st.day.getDay()] + ', ' + fmtDate(st.day) : '…'));
    L.push('Uhrzeit: ' + (st.time || '…'));
    L.push('Personen: ' + (st.persons || '…'));
    if (st.occasion) L.push('Anlass: ' + st.occasion);
  }
  if (name) L.push('Name: ' + name);
  if (note) L.push('Hinweis: ' + note);
  L.push('Bitte kurz bestätigen. Danke!');
  return L.join('\n');
}
function ready(){ return A.mode === 'order' ? cart.size && st.time : st.day && st.time && st.persons; }
function updateMsg(){
  if (!$('#msg')) return;
  const text = message(), ok = ready(), btn = $('#waBtn');
  $('#msg').textContent = text;
  btn.setAttribute('aria-disabled', ok ? 'false' : 'true');
  btn.href = ok ? 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent(text) : '#';
  const miss = A.mode === 'order' ? [!cart.size && 'mindestens ein Gericht', !st.time && 'eine Abholzeit'] : [!st.day && 'Tag', !st.time && 'Uhrzeit', !st.persons && 'Personen'];
  const m = miss.filter(Boolean);
  $('#hint').textContent = ok ? 'WhatsApp öffnet sich mit dieser Nachricht. Du musst sie nur noch absenden.' : 'Wähl noch ' + m.join(', ').replace(/, ([^,]*)$/, ' und $1') + '.';
  if (ORDER){
    let n = 0, sum = 0; ITEMS.forEach(it => { const q = cart.get(it.id); if (q){ n += q; sum += q * it.price; } });
    document.body.classList.toggle('has-cart', n > 0);
    $('#cartbar').innerHTML = '<span>Warenkorb · ' + n + '</span><span>' + euro(sum) + ' →</span>';
  }
}
function renderPanel(){
  const P = $('#panel'), keep = {name: $('#fName') ? $('#fName').value : '', note: $('#fNote') ? $('#fNote').value : ''};
  let h = '';
  if (A.mode === 'external'){
    h = '<div class="ext"><p class="big">' + esc(A.extTitle) + '</p><p class="mute">' + esc(A.extText) + '</p><a class="btn btn-acc" href="' + A.url + '" target="_blank" rel="noopener">' + esc(A.extBtn) + '</a></div>';
    P.innerHTML = h; return;
  }
  if (A.mode === 'order'){
    let sum = 0;
    const rows = ITEMS.filter(it => cart.get(it.id)).map(it => { const q = cart.get(it.id); sum += q * it.price;
      return '<li><span>' + esc(it.name) + '</span><span class="qty"><button type="button" data-id="' + it.id + '" data-d="-1" aria-label="weniger">−</button><span>' + q + '</span><button type="button" data-id="' + it.id + '" data-d="1" aria-label="mehr">+</button></span><span class="lp">' + euro(q * it.price) + '</span></li>'; }).join('');
    h += '<fieldset class="step"><legend><span>01</span>Deine Bestellung</legend>' + (rows ? '<ul class="cart">' + rows + '</ul><div class="total"><span>Summe</span><span>' + euro(sum) + '</span></div>' : '<p class="empty">Noch leer. Tipp in der Karte auf „+“, um Gerichte hinzuzufügen.</p>') + '</fieldset>';
    const now = berlinNow(), open = OPEN.open, slots = open ? ['sofort'].concat(slotsFor(now, 15, 20).slice(0, 12)) : [];
    h += '<fieldset class="step"><legend><span>02</span>Abholung</legend>' + (slots.length ? '<div class="chips" id="tchips">' + slots.map(t => chip(t === 'sofort' ? 'So schnell wie möglich' : t, null, st.time === t)).join('') + '</div>' : '<p class="empty">' + esc(OPEN.text) + '. Bestellungen gehen, sobald wieder geöffnet ist.</p>') + '</fieldset>';
  } else {
    const days = openDays(10), slots = st.day ? slotsFor(st.day, 30, 60) : [];
    h += '<fieldset class="step"><legend><span>01</span>Tag</legend><div class="days" id="dchips">' + days.map(d => { const t = berlinNow(), tm = new Date(t); tm.setDate(t.getDate() + 1);
      const lab = d.toDateString() === t.toDateString() ? 'Heute' : d.toDateString() === tm.toDateString() ? 'Morgen' : DAY_SHORT[d.getDay()];
      return chip(lab, fmtDate(d), st.day && st.day.getTime() === d.getTime()); }).join('') + '</div></fieldset>';
    h += '<fieldset class="step"><legend><span>02</span>Uhrzeit</legend>' + (st.day ? '<div class="times" id="tchips">' + slots.map(t => chip(t, null, st.time === t)).join('') + '</div>' : '<p class="empty">Erst einen Tag wählen.</p>') + '</fieldset>';
    h += '<fieldset class="step"><legend><span>03</span>Personen</legend><div class="chips" id="pchips">' + A.persons.map(p => chip(p, null, st.persons === p)).join('') + '</div></fieldset>';
    h += '<fieldset class="step"><legend><span>04</span>Anlass (optional)</legend><div class="chips" id="ochips">' + A.occasions.map(p => chip(p, null, st.occasion === p)).join('') + '</div></fieldset>';
  }
  h += '<div class="field"><label for="fName">Dein Name</label><input id="fName" autocomplete="given-name" placeholder="z. B. Can"></div>';
  h += '<div class="field"><label for="fNote">' + esc(A.noteLabel) + '</label><textarea id="fNote" placeholder="' + esc(A.notePh) + '"></textarea></div>';
  h += '<div class="field"><label>Deine Nachricht</label><div class="msg" id="msg"></div></div>';
  h += '<a class="btn btn-acc" id="waBtn" href="#" target="_blank" rel="noopener" aria-disabled="true">Per WhatsApp senden</a><p class="hint" id="hint"></p>';
  P.innerHTML = h;
  $('#fName').value = keep.name; $('#fNote').value = keep.note;
  $('#fName').oninput = $('#fNote').oninput = updateMsg;
  $('#waBtn').onclick = e => { if ($('#waBtn').getAttribute('aria-disabled') === 'true') e.preventDefault(); };
  P.querySelectorAll('.qty button').forEach(b => b.onclick = () => { const id = b.dataset.id, q = (cart.get(id) || 0) + +b.dataset.d; q > 0 ? cart.set(id, q) : cart.delete(id); renderPanel(); renderMenu(); });
  const bind = (sel, list, key, after) => { const box = P.querySelector(sel); if (!box) return; box.querySelectorAll('.chip').forEach((c,i) => c.onclick = () => { st[key] = st[key] === list[i] && key === 'occasion' ? null : list[i]; if (after) after(); renderPanel(); }); };
  if (A.mode === 'order'){ bind('#tchips', ['sofort'].concat(slotsFor(berlinNow(), 15, 20).slice(0, 12)), 'time'); }
  else {
    bind('#dchips', openDays(10), 'day', () => { st.time = null; });
    if (st.day) bind('#tchips', slotsFor(st.day, 30, 60), 'time');
    bind('#pchips', A.persons, 'persons'); bind('#ochips', A.occasions, 'occasion');
  }
  updateMsg();
}
renderPanel();

/* ---------- reviews, faq ---------- */
if (CFG.reviews && CFG.reviews.length){
  $('#score').innerHTML = CFG.rating ? '<b>' + CFG.rating.score + '</b><div><div class="stars">' + stars + '</div><span class="mute">' + CFG.rating.count + ' Bewertungen bei Google</span></div>' : '';
  $('#reviews').innerHTML = CFG.reviews.map(r => '<article class="rev"><div class="rev-top"><span class="ava" aria-hidden="true">' + esc((r.by || 'G')[0]) + '</span><div><b>' + esc(r.by || 'Google-Bewertung') + '</b><small>' + (r.by ? 'Google' : stars) + '</small></div></div><p>„' + esc(r.text) + '“</p></article>').join('');
  $('#allReviews').href = mapsUrl;
} else { $('#bewertungen').hidden = true; }
$('#faqList').innerHTML = CFG.faq.map((f,i) => '<details' + (i ? '' : ' open') + '><summary>' + esc(f[0]) + '</summary><p>' + esc(f[1]) + '</p></details>').join('');

/* ---------- contact, footer ---------- */
$('#cAddr').innerHTML = CFG.address.map(esc).join('<br>');
$('#phone').textContent = CFG.phone; $('#cPhoneLabel').textContent = CFG.phoneLabel || 'Telefon';
$('#cCta').textContent = CFG.cta.long;
(function(){
  const ul = $('#hours'), today = berlinNow().getDay();
  if (!CFG.hours){ ul.innerHTML = '<li><span>' + esc(CFG.hoursNote) + '</span></li>'; return; }
  [1,2,3,4,5,6,0].forEach(d => { const H = CFG.hours[d];
    ul.insertAdjacentHTML('beforeend', '<li' + (d === today ? ' class="today"' : '') + '><span>' + DAY_LONG[d] + '</span><span>' + (H ? hhmm(H[0]) + ' – ' + hhmm(H[1]) : 'geschlossen') + '</span></li>'); });
})();
$('#mapLink').href = mapsUrl; $('#mapImg').src = CFG.mapPhoto; $('#mapAddr').textContent = CFG.address[0];
$('#fSub').textContent = CFG.logoSub; $('#footName').textContent = CFG.logo;
$('#fInfo').innerHTML = '<span>' + esc(CFG.address.join(', ')) + '</span><span>' + esc(CFG.phone) + '</span>' + (CFG.instagram ? '<a href="https://instagram.com/' + CFG.instagram + '" target="_blank" rel="noopener">Instagram @' + esc(CFG.instagram) + '</a>' : '') + '<nav aria-label="Rechtliches"><a href="#top">Impressum</a><a href="#top">Datenschutz</a></nav>';
$('#copyPhone').addEventListener('click', e => {
  const btn = e.currentTarget, sel = () => getSelection().selectAllChildren($('#phone'));
  try { navigator.clipboard.writeText(CFG.phone).then(() => { btn.textContent = 'Kopiert'; setTimeout(() => btn.textContent = 'Nummer kopieren', 1800); }, sel); } catch (_) { sel(); }
});

/* ---------- scroll motion ---------- */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const groups = [['.sec h2',''],['.sec-head p, .sec-head .score',''],['.map','rv-clip'],['.intro-head p',''],['.badge, .icard',''],['.st-line',''],['.tour',''],['.mlist li',''],['.act-info > *:not(h2)',''],['.panel',''],['.rev',''],['.faq details',''],['.c-card',''],['.foot-card','']];
  let pending = [];
  groups.forEach(([sel, extra]) => { const seen = new Map();
    document.querySelectorAll(sel).forEach(el => { el.classList.add('rv'); if (extra) el.classList.add(extra);
      const n = seen.get(el.parentElement) || 0; seen.set(el.parentElement, n + 1);
      el.style.setProperty('--d', Math.min(n, 6) * 0.08 + 's');
      if (el.getBoundingClientRect().top > innerHeight * 0.92){ el.classList.add('pre'); pending.push(el); } }); });
  const reveal = () => { if (!pending.length) return; const line = innerHeight * 0.92;
    pending = pending.filter(el => { if (el.getBoundingClientRect().top < line){ el.classList.remove('pre'); return false; } return true; }); };
  addEventListener('scroll', reveal, {passive:true}); addEventListener('resize', reveal); addEventListener('load', reveal);
})();

/* ---------- menu + active section ---------- */
(function(){
  const nav = $('.nav'), burger = $('.burger'), links = [...document.querySelectorAll('.nav ul a')];
  const setOpen = v => { nav.classList.toggle('open', v); burger.setAttribute('aria-expanded', v); burger.setAttribute('aria-label', v ? 'Menü schließen' : 'Menü öffnen'); };
  burger.addEventListener('click', () => setOpen(!nav.classList.contains('open')));
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setOpen(false)));
  document.addEventListener('click', e => { if (!nav.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  const mark = () => { const y = innerHeight * 0.45; let cur = '';
    NAV.forEach(([id]) => { const el = document.getElementById(id); if (el && !el.hidden && el.getBoundingClientRect().top < y) cur = id; });
    links.forEach(l => l.classList.toggle('on', l.dataset.sec === cur)); };
  addEventListener('scroll', mark, {passive:true}); mark();
})();
</script>
